<!doctype html>
<html>
<head>
  <title>Feedback</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
      width: 520px;
      text-align: center;
    }

    h1 { margin-bottom: 20px; }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 14px;
      resize: vertical;
      min-height: 120px;
      margin-bottom: 16px;
    }

    .file-wrap {
      text-align: left;
      margin-bottom: 18px;
    }

    .file-label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    /* Hide default file input */
    input[type="file"] {
      display: none;
    }

    .file-btn {
      display: inline-block;
      background: #eef5ff;
      color: #1e73e8;
      border: 1px solid #cfe3ff;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .file-btn:hover {
      background: #e3efff;
    }

    .file-name {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      min-height: 16px;
      word-break: break-all;
    }

    .error {
        background-color: #ffe5e5;
        color: #c0392b;
        padding: 10px;
        border-radius: 6px;
        margin-top: 15px;
        margin-bottom: 15px;
        font-size: 14px;
        transition: opacity 0.5s ease;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: linear-gradient(to right, #1e73e8, #1976d2);
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { opacity: 0.95; }

    .link {
      margin-top: 18px;
      font-size: 14px;
    }

    .link a {
      text-decoration: none;
      color: #1e73e8;
      font-weight: 500;
    }

    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Submit Feedback</h1>

    <form method="POST" action="/submit" enctype="multipart/form-data">
      <textarea name="text" placeholder="Type your feedback here..."></textarea>

      <div class="file-wrap">
        <span class="file-label">Optional image</span>

        <label class="file-btn" for="image">Choose Image</label>
        <input id="image" name="image" type="file" accept=".png,.jpg,.jpeg,.gif">

        <div id="fileName" class="file-name"></div>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div class="link">
      <a href="/submissions">View Submissions</a>
    </div>

    {% if error %}
        <div id="error-message" class="error">
            {{ error }}
        </div>
    {% endif %}

  </div>

  <script>
    const error = document.getElementById("error-message");
    if (error) {
        setTimeout(() => {
            error.style.opacity = "0";
            setTimeout(() => {
                error.remove();
            }, 500);
        }, 3000);
    }

    const fileInput = document.getElementById("image");
    const fileName = document.getElementById("fileName");

    fileInput.addEventListener("change", () => {
      fileName.textContent = fileInput.files?.[0]?.name || "";
    });
  </script>

</body>
</html>
